services:
  inference-lab:
    build: .
    ports:
      - "8000:8000"
    environment:
      INFERENCE_LAB_BACKEND: mock
      # Fault-injection knob (Phase 6+): defaults to 0 (healthy, unchanged
      # behavior) unless overridden via a shell env var at `docker compose
      # up` time - see experiments/phase6_latency_fault.md. Never edit this
      # default in the file itself; override it on the command line so
      # "healthy" always means "don't pass an override," not "undo an edit."
      INFERENCE_LAB_MOCK_EXTRA_LATENCY_MS: ${INFERENCE_LAB_MOCK_EXTRA_LATENCY_MS:-0}
      # Server-side generation concurrency limit (Phase 8B): defaults to 0
      # (unlimited) unless overridden via a shell env var at `docker compose
      # up` time - see experiments/phase8_concurrency_overload.md.
      INFERENCE_LAB_MAX_CONCURRENT_GENERATIONS: ${INFERENCE_LAB_MAX_CONCURRENT_GENERATIONS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - inference-lab

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
